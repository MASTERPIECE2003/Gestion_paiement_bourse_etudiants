name: deploy

on:
  push:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        env:
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: "1025"
          SPRING_MAIL_USERNAME: test
          SPRING_MAIL_PASSWORD: test
        run: ./gradlew --no-daemon clean test

  package-artifact:
    name: Package JAR
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build executable JAR
        run: ./gradlew --no-daemon bootJar

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-jar-${{ github.ref_name }}-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 7

  publish-image:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: package-artifact
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tags
        id: tags
        run: |
          BRANCH_TAG="${GITHUB_REF_NAME}"
          SHA_TAG="${GITHUB_SHA::7}"
          IMAGE_BASE="ghcr.io/${{ github.repository_owner }}/financial-student-backends"
          echo "image_base=${IMAGE_BASE}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tags.outputs.image_base }}:${{ steps.tags.outputs.branch_tag }}
            ${{ steps.tags.outputs.image_base }}:${{ steps.tags.outputs.branch_tag }}-${{ steps.tags.outputs.sha_tag }}

  deploy-staging:
    name: Deploy staging (develop)
    runs-on: ubuntu-latest
    needs: publish-image
    if: github.ref_name == 'develop' && github.event_name == 'push'
    environment: staging

    steps:
      - name: Trigger staging deploy command
        env:
          DEPLOY_CMD: ${{ secrets.STAGING_DEPLOY_COMMAND }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/financial-student-backends:develop
        run: |
          if [ -z "$DEPLOY_CMD" ]; then
            echo "::warning::STAGING_DEPLOY_COMMAND n'est pas configure. Deployment ignore."
            exit 0
          fi

          echo "Running staging deployment command"
          bash -lc "$DEPLOY_CMD"

  deploy-production:
    name: Deploy production (main)
    runs-on: ubuntu-latest
    needs: publish-image
    if: github.ref_name == 'main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Trigger production deploy command
        env:
          DEPLOY_CMD: ${{ secrets.PRODUCTION_DEPLOY_COMMAND }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/financial-student-backends:main
        run: |
          if [ -z "$DEPLOY_CMD" ]; then
            echo "::warning::PRODUCTION_DEPLOY_COMMAND n'est pas configure. Deployment ignore."
            exit 0
          fi

          echo "Running production deployment command"
          bash -lc "$DEPLOY_CMD"

